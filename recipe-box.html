<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">The Recipe Box<small>your kitchen, indexed</small></div>
    <div class="tabs-heading">Browse</div>
    <div class="tabs" id="tabs"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input id="searchInput" type="text" placeholder="Search recipes or ingredients…">
      </div>
      <button class="btn btn-accent" id="newRecipeBtn">+ New Recipe</button>
      <div class="user-chip" id="userChip"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none;">
      <h2>Nothing here yet</h2>
      <p>This box is looking a little empty. Add your first recipe and start filling the shelf.</p>
      <button class="btn btn-accent" id="emptyAddBtn">+ New Recipe</button>
    </div>
  </main>
</div>

<button class="shop-fab" id="shopFab">
  🧺 Shopping list <span class="badge" id="shopBadge">0</span>
</button>

<div id="shopBackdrop" class="backdrop-dim" style="display:none;"></div>
<div class="shop-panel" id="shopPanel">
  <div class="shop-head">
    <h2>Shopping list</h2>
    <button class="close-x" id="shopClose">&times;</button>
  </div>
  <div class="shop-body" id="shopBody"></div>
  <div class="shop-foot">
    <button class="btn btn-ghost" id="clearShopBtn" style="width:100%;">Clear list</button>
  </div>
</div>

<div id="detailOverlay" class="overlay" style="display:none;"></div>
<div id="formOverlay" class="overlay" style="display:none;"></div>
<div id="catModalOverlay" class="overlay" style="display:none; z-index:60;"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/shopping.js"></script>
<script src="assets/js/render-grid.js"></script>
<script src="assets/js/render-detail.js"></script>
<script src="assets/js/form.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
